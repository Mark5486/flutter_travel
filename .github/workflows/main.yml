name: Flutter CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Analyze & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Show Flutter version
      - name: Flutter version
        run: flutter --version

      # 4. Get dependencies
      - name: Get dependencies
        run: flutter pub get

      # 5. Analyze project
      # Infos and warnings will not fail the workflow.
      # Real analyzer errors will still fail it.
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 6. Run tests if tests exist
      - name: Run Flutter tests
        run: |
          if [ -d "test" ] && find test -name "*_test.dart" | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found. Skipping tests."
          fi